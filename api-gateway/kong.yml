_format_version: "3.0"
_transform: true

# CORS global — cobre todas as rotas/serviços abaixo em um único ponto,
# evitando configurar CORS individualmente em cada microsserviço interno.
# Em produção, substituir "*" por lista explícita de origens confiáveis.
plugins:
  - name: cors
    config:
      origins:
        - "*"
      methods:
        - GET
        - POST
        - PUT
        - DELETE
        - OPTIONS
        - PATCH
      headers:
        - Accept
        - Authorization
        - Content-Type
        - X-Request-ID
      exposed_headers:
        - X-Request-ID
      credentials: true
      max_age: 3600
      preflight_continue: false

services:
  - name: user-service
    url: http://user-service:8081
    routes:
      - name: auth-routes
        paths: ["/api/v1/auth", "/api/v1/users", "/api/v1/academies"]
        strip_path: false
    plugins:
      - name: rate-limiting
        config: { minute: 60, policy: local }

  - name: pose-service-video
    url: http://pose-service:8083
    routes:
      - name: pose-video-route
        paths: ["/api/v1/pose/analyze-video"]
        strip_path: false
    plugins:
      - name: rate-limiting
        config: { minute: 10, hour: 50, policy: local }
      - name: request-size-limiting
        config: { allowed_payload_size: 512 }

  - name: pose-service
    url: http://pose-service:8083
    routes:
      - name: pose-routes
        paths: ["/api/v1/pose"]
        strip_path: false
    plugins:
      - name: rate-limiting
        config: { minute: 300, policy: local }
      - name: request-size-limiting
        config: { allowed_payload_size: 512 }

  - name: session-service
    url: http://session-service:8082
    routes:
      - name: session-routes
        paths: ["/api/v1/sessions", "/api/v1/workout-plans"]
        strip_path: false
    plugins:
      - name: rate-limiting
        config: { minute: 300, policy: local }

  - name: notification-service
    url: http://notification-service:8085
    routes:
      - name: notify-routes
        paths: ["/api/v1/notify", "/ws"]
        strip_path: false

  - name: analytics-service
    url: http://analytics-service:8086
    routes:
      - name: analytics-routes
        paths: ["/api/v1/analytics"]
        strip_path: false
    plugins:
      - name: rate-limiting
        config: { minute: 120, policy: local }
