_format_version: "3.0"
_transform: true

services:
  - name: user-service
    url: http://user-service:8081
    routes:
      - name: auth-routes
        paths: ["/api/v1/auth", "/api/v1/users"]
        strip_path: false
    plugins:
      - name: rate-limiting
        config: { minute: 60, policy: local }

  - name: pose-service
    url: http://pose-service:8083
    routes:
      - name: pose-routes
        paths: ["/api/v1/pose"]
        strip_path: false
    plugins:
      - name: rate-limiting
        config: { minute: 600, policy: local }
      - name: request-size-limiting
        config: { allowed_payload_size: 512 }

  - name: session-service
    url: http://session-service:8082
    routes:
      - name: session-routes
        paths: ["/api/v1/sessions"]
        strip_path: false
    plugins:
      - name: rate-limiting
        config: { minute: 300, policy: local }

  - name: notification-service
    url: http://notification-service:8085
    routes:
      - name: notify-routes
        paths: ["/api/v1/notify", "/ws"]
        strip_path: false

  - name: analytics-service
    url: http://analytics-service:8086
    routes:
      - name: analytics-routes
        paths: ["/api/v1/analytics"]
        strip_path: false
    plugins:
      - name: rate-limiting
        config: { minute: 120, policy: local }
