server:
  port: 8082

spring:
  application:
    name: session-service

  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/gymvision_sessions}
    username: ${SPRING_DATASOURCE_USERNAME:gymvision}
    password: ${SPRING_DATASOURCE_PASSWORD:gymvision123}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect

  flyway:
    enabled: true
    locations: classpath:db/migration

  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USERNAME:gymvision}
    password: ${RABBITMQ_PASSWORD:gymvision123}

management:
  endpoints:
    web:
      exposure:
        include: health,info
