name: GymVision CI/CD

on:
  push:
    branches: [main, master, develop]
  pull_request:
    branches: [main, master]

env:
  REGISTRY: ghcr.io
  IMAGE_PREFIX: ${{ github.repository_owner }}/gymvision
  DOCKERHUB_IMAGE_PREFIX: souzzamatheus/gymvision

jobs:

  # ── User Service (Kotlin/Spring Boot) ────────────────────────────────────────
  user-service-test:
    name: User Service — Test
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: gymvision
          POSTGRES_PASSWORD: gymvision123
          POSTGRES_DB: gymvision_users_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: --health-cmd "redis-cli ping" --health-interval 10s --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: temurin
          cache: gradle

      - name: Run tests
        working-directory: user-service
        env:
          SPRING_DATASOURCE_URL: jdbc:postgresql://localhost:5432/gymvision_users_test
          SPRING_DATASOURCE_USERNAME: gymvision
          SPRING_DATASOURCE_PASSWORD: gymvision123
          SPRING_REDIS_HOST: localhost
          SPRING_REDIS_PASSWORD: ""
          JWT_SECRET: test-secret-key-minimum-32-characters-long
        run: ./gradlew test jacocoTestReport --no-daemon

      - name: Upload coverage
        uses: codecov/codecov-action@v4
        with:
          files: user-service/build/reports/jacoco/test/jacocoTestReport.xml
          flags: user-service

  # ── Pose Service (Python/FastAPI) ────────────────────────────────────────────
  pose-service-test:
    name: Pose Service — Test
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        working-directory: pose-service
        run: pip install -r requirements.txt pytest-cov

      - name: Run tests
        working-directory: pose-service
        run: pytest tests/ -v --cov=. --cov-report=xml --cov-report=term-missing

      - name: Upload coverage
        uses: codecov/codecov-action@v4
        with:
          files: pose-service/coverage.xml
          flags: pose-service

  # ── Session Service (Kotlin/Spring Boot) ─────────────────────────────────────
  session-service-build:
    name: Session Service — Build
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: temurin
          cache: gradle

      - name: Build
        working-directory: session-service
        run: ./gradlew build --no-daemon -x test

  # ── Analytics Service (Python/FastAPI) ───────────────────────────────────────
  analytics-service-test:
    name: Analytics Service — Lint
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        working-directory: analytics-service
        run: pip install -r requirements.txt flake8

      - name: Lint
        working-directory: analytics-service
        run: flake8 src/main.py --max-line-length=120 --ignore=E501,W503,E221,E241

  # ── Dashboard (React/Vite) ────────────────────────────────────────────────────
  dashboard-build:
    name: Dashboard — Build
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: dashboard/package-lock.json

      - name: Install dependencies
        working-directory: dashboard
        run: npm ci

      - name: Build
        working-directory: dashboard
        run: npm run build

  # ── Android App ───────────────────────────────────────────────────────────────
  android-build:
    name: Android — Debug APK
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: temurin
          cache: gradle

      - name: Build debug APK
        working-directory: android-app
        run: ./gradlew assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: gymvision-debug-${{ github.sha }}
          path: android-app/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 7

  # ── Docker Compose validation ─────────────────────────────────────────────────
  compose-validate:
    name: docker-compose — config validation
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Validate docker-compose.yml
        run: docker compose config --quiet

  # ── Build & Push Docker images ───────────────────────────────────────────────
  build-and-push:
    name: Build & Push Images
    runs-on: ubuntu-latest
    needs: [user-service-test, pose-service-test, session-service-build, dashboard-build, android-build]
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: souzzamatheus
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build & push user-service
        uses: docker/build-push-action@v5
        with:
          context: ./user-service
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}/user-service:latest
            ${{ env.DOCKERHUB_IMAGE_PREFIX }}-user-service:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build & push pose-service
        uses: docker/build-push-action@v5
        with:
          context: ./pose-service
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}/pose-service:latest
            ${{ env.DOCKERHUB_IMAGE_PREFIX }}-pose-service:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build & push session-service
        uses: docker/build-push-action@v5
        with:
          context: ./session-service
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}/session-service:latest
            ${{ env.DOCKERHUB_IMAGE_PREFIX }}-session-service:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build & push analytics-service
        uses: docker/build-push-action@v5
        with:
          context: ./analytics-service
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}/analytics-service:latest
            ${{ env.DOCKERHUB_IMAGE_PREFIX }}-analytics-service:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build & push backup-service
        uses: docker/build-push-action@v5
        with:
          context: ./backup-service
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}/backup-service:latest
            ${{ env.DOCKERHUB_IMAGE_PREFIX }}-backup-service:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build & push notification-service
        uses: docker/build-push-action@v5
        with:
          context: ./notification-service
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}/notification-service:latest
            ${{ env.DOCKERHUB_IMAGE_PREFIX }}-notification-service:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ── Deploy Staging ───────────────────────────────────────────────────────────
  deploy-staging:
    name: Deploy to Staging
    runs-on: ubuntu-latest
    needs: build-and-push
    environment: staging

    steps:
      - uses: actions/checkout@v4

      - name: Deploy via docker compose
        uses: appleboy/ssh-action@v1.0.0
        with:
          host: ${{ secrets.STAGING_HOST }}
          username: ${{ secrets.STAGING_USER }}
          key: ${{ secrets.STAGING_SSH_KEY }}
          script: |
            cd /opt/gymvision
            docker compose pull
            docker compose up -d --remove-orphans
            docker compose ps
