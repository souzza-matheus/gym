name: GymVision CI/CD

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

env:
  REGISTRY: ghcr.io
  IMAGE_PREFIX: ${{ github.repository_owner }}/gymvision

jobs:

  # ── User Service (Kotlin/Spring Boot) ────────────────────────────────────────
  user-service-test:
    name: User Service — Test
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: gymvision
          POSTGRES_PASSWORD: gymvision123
          POSTGRES_DB: gymvision_users_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: --health-cmd "redis-cli ping" --health-interval 10s --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: temurin
          cache: gradle

      - name: Run tests
        working-directory: user-service
        env:
          SPRING_DATASOURCE_URL: jdbc:postgresql://localhost:5432/gymvision_users_test
          SPRING_DATASOURCE_USERNAME: gymvision
          SPRING_DATASOURCE_PASSWORD: gymvision123
          SPRING_REDIS_HOST: localhost
          SPRING_REDIS_PASSWORD: ""
          JWT_SECRET: test-secret-key-minimum-32-characters-long
        run: ./gradlew test jacocoTestReport --no-daemon

      - name: Upload coverage
        uses: codecov/codecov-action@v4
        with:
          files: user-service/build/reports/jacoco/test/jacocoTestReport.xml
          flags: user-service

  # ── Pose Service (Python/FastAPI) ────────────────────────────────────────────
  pose-service-test:
    name: Pose Service — Test
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        working-directory: pose-service
        run: pip install -r requirements.txt pytest-cov

      - name: Run tests
        working-directory: pose-service
        run: pytest tests/ -v --cov=. --cov-report=xml --cov-report=term-missing

      - name: Upload coverage
        uses: codecov/codecov-action@v4
        with:
          files: pose-service/coverage.xml
          flags: pose-service

  # ── Build & Push Docker images ───────────────────────────────────────────────
  build-and-push:
    name: Build & Push Images
    runs-on: ubuntu-latest
    needs: [user-service-test, pose-service-test]
    if: github.ref == 'refs/heads/main'

    steps:
      - uses: actions/checkout@v4

      - name: Log in to Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build & push user-service
        uses: docker/build-push-action@v5
        with:
          context: ./user-service
          push: true
          tags: ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}/user-service:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build & push pose-service
        uses: docker/build-push-action@v5
        with:
          context: ./pose-service
          push: true
          tags: ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}/pose-service:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ── Deploy Staging ───────────────────────────────────────────────────────────
  deploy-staging:
    name: Deploy to Staging
    runs-on: ubuntu-latest
    needs: build-and-push
    environment: staging

    steps:
      - uses: actions/checkout@v4

      - name: Deploy via docker compose
        uses: appleboy/ssh-action@v1.0.0
        with:
          host: ${{ secrets.STAGING_HOST }}
          username: ${{ secrets.STAGING_USER }}
          key: ${{ secrets.STAGING_SSH_KEY }}
          script: |
            cd /opt/gymvision
            docker compose pull
            docker compose up -d --remove-orphans
            docker compose ps
